<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css?v=20261116-products" />
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <h3>MedMart</h3>
            <nav>
                <a href="/index.html">Dashboard</a>
                <a href="/branches.html">Branches</a>
                <a href="/products.html" class="active">Products</a>
                <a href="/suppliers.html">Suppliers</a>
                <a href="/customers.html">Customers</a>
                <a href="/inventory.html">Inventory</a>
                <a href="/sales.html">Sales</a>
            </nav>
        </aside>
        <main class="content">
            <nav class="topbar navbar navbar-expand-lg">
                <div class="container-fluid d-flex justify-content-between align-items-center">
                    <span>Medicine Management</span>
                    <span class="badge bg-success">DB-backed CRUD</span>
                </div>
            </nav>
            <div class="container-fluid py-4">
                <div class="card mb-4">
                    <div class="card-header">Add / Update Product</div>
                    <div class="card-body">
                        <form id="productForm">
                            <input type="hidden" name="product_id" id="product_id" />
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <input class="form-control" name="product_name" placeholder="Medicine name"
                                        required />
                                </div>
                                <div class="col-md-3">
                                    <input class="form-control" name="brand" placeholder="Brand" />
                                </div>
                                <div class="col-md-2">
                                    <input class="form-control" name="category_id" type="number"
                                        placeholder="Category ID" required />
                                </div>
                                <div class="col-md-3">
                                    <input class="form-control" name="supplier_id" type="number"
                                        placeholder="Supplier ID" required />
                                </div>
                                <div class="col-md-3">
                                    <input class="form-control" name="unit_price" type="number" step="0.01"
                                        placeholder="Unit price" required />
                                </div>
                                <div class="col-md-3">
                                    <input class="form-control" name="cost_price" type="number" step="0.01"
                                        placeholder="Cost price" required />
                                </div>
                                <div class="col-md-2">
                                    <input class="form-control" name="unit_of_measure" value="STRIP"
                                        placeholder="Unit" />
                                </div>
                                <div class="col-md-2">
                                    <input class="form-control" name="drug_schedule" value="OTC"
                                        placeholder="OTC/H/X" />
                                </div>
                                <div class="col-md-2">
                                    <input class="form-control" name="hsn_code" placeholder="HSN" />
                                </div>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-primary me-2" id="submitBtn" type="submit">Save Product</button>
                                <button class="btn btn-outline-secondary" type="button" id="resetBtn">Reset</button>
                            </div>
                        </form>
                        <div id="productMessage" class="mt-3"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Medicine List</span>
                        <input id="productSearch" class="form-control w-auto" placeholder="Search products..." />
                    </div>
                    <div class="card-body">
                        <div id="productsTable"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/js/products.js?v=20261116-products"></script>
</body>

</html>
