<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashier Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <h3>MedMart</h3>
            <nav>
                <a href="/index.html">Dashboard</a>
                <a href="/manager.html">Manager Portal</a>
                <a href="/cashier.html" class="active">Cashier</a>
                <a href="/branches.html">Branches</a>
                <a href="/products.html">Products</a>
                <a href="/inventory.html">Inventory</a>
                <a href="/sales.html">Sales</a>
            </nav>
        </aside>
        <main class="content">
            <nav class="topbar navbar navbar-expand-lg">
                <div class="container-fluid"><span>Cashier Operations</span></div>
            </nav>
            <div class="container-fluid py-4">
                <div class="card mb-4">
                    <div class="card-header">Create Sale</div>
                    <div class="card-body">
                        <form id="saleForm">
                            <div class="row g-2">
                                <div class="col-md-3"><input class="form-control" name="branch_id" type="number" placeholder="Branch ID" required></div>
                                <div class="col-md-3"><input class="form-control" name="customer_id" type="number" placeholder="Customer ID (optional)"></div>
                                <div class="col-md-3"><input class="form-control" name="employee_id" type="number" placeholder="Employee ID" required></div>
                                <div class="col-md-3"><select class="form-select" name="payment_method"><option value="CASH">CASH</option><option value="CARD">CARD</option><option value="UPI">UPI</option><option value="INSURANCE">INSURANCE</option></select></div>
                            </div>
                            <div class="mt-3">
                                <label class="form-label">Items (JSON format)</label>
                                <textarea class="form-control" name="items" rows="6" required>[{"product_id":1,"quantity":2,"unit_price":120.00,"discount_pct":0}]</textarea>
                            </div>
                            <div class="row g-2 mt-2">
                                <div class="col-md-4"><input class="form-control" name="discount" type="number" step="0.01" value="0" placeholder="Discount"></div>
                                <div class="col-md-4"><input class="form-control" name="notes" placeholder="Notes"></div>
                                <div class="col-md-4"><input class="form-control" name="prescription_no" placeholder="Prescription no"></div>
                            </div>
                            <button class="btn btn-primary mt-3" type="submit">Process Sale</button>
                        </form>
                        <div id="saleMessage" class="mt-3"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">Customers</div>
                    <div class="card-body">
                        <div id="customersTable"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/js/cashier.js"></script>
</body>
</html>
