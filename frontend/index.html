<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedMart Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <h3>MedMart</h3>
            <nav>
                <a href="/index.html" class="active">Dashboard</a>
                <a href="/branches.html">Branches</a>
                <a href="/products.html">Products</a>
                <a href="/suppliers.html">Suppliers</a>
                <a href="/customers.html">Customers</a>
                <a href="/inventory.html">Inventory</a>
                <a href="/sales.html">Sales</a>
            </nav>
        </aside>
        <main class="content">
            <nav class="topbar navbar navbar-expand-lg">
                <div class="container-fluid">
                    <span>Retail Analytics Dashboard</span>
                </div>
            </nav>
            <div class="container-fluid py-4">
                <div class="row g-3 mb-4" id="statCards"></div>
                <div class="row g-4">
                    <div class="col-lg-6"><canvas id="salesTrendChart"></canvas></div>
                    <div class="col-lg-6"><canvas id="branchChart"></canvas></div>
                </div>
                <div class="card mt-4">
                    <div class="card-header">Recent Transactions</div>
                    <div class="card-body">
                        <table class="table table-striped" id="recentSalesTable"></table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/js/dashboard.js"></script>
</body>

</html>
