<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedMart Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css?v=20261116-login" />
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="mb-3">MedMart Login</h3>
                        <p class="text-muted">Demo role-based access for manager and cashier users.</p>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input class="form-control" name="username" placeholder="manager or cashier1"
                                    required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input class="form-control" name="password" type="password" placeholder="Enter password"
                                    required />
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Login</button>
                        </form>
                        <div id="loginMessage" class="mt-3"></div>
                        <hr />
                        <small class="text-muted d-block">Demo accounts:</small>
                        <small class="text-muted d-block">manager / manager123</small>
                        <small class="text-muted d-block">cashier1 / cashier123</small>
                        <small class="text-muted d-block">cashier2 / cashier123</small>
                        <small class="text-muted d-block">cashier3 / cashier123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js?v=20261116-login"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginMessage = document.getElementById('loginMessage');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const form = new FormData(loginForm);
            const username = String(form.get('username') || '').trim();
            const password = String(form.get('password') || '').trim();
            const user = DEMO_USERS[username];

            if (!user || user.password !== password) {
                loginMessage.innerHTML = '<div class="alert alert-danger">Invalid username or password.</div>';
                return;
            }

            loginUser(user);
            window.location.href = user.role === 'manager' ? '/manager.html' : '/cashier.html';
        });
    </script>
</body>

</html>
